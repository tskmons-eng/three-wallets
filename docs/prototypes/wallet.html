<title>3つの財布</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 1列のスマホ画面。上に3つの財布、下に今月の内訳。下のバーと大きな＋で入力 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --fg:#17202a; --muted:#5d6b78; --line:#d3dae1;
  --accent:#1f5f8b; --accent-fg:#ffffff;
  --co:#2f5d8a; --me:#2f8a63; --inv:#b0761b;
  --out:#b23b3b; --in:#23794f;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --sunk:#222d38; --fg:#e7edf2; --muted:#93a3b1; --line:#2c3946;
  --accent:#5aa4d6; --accent-fg:#0b1722; --co:#78a7d6; --me:#5cc495; --inv:#e0a54a; --out:#ef7a7a; --in:#5cc495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --sunk:#222d38; --fg:#e7edf2; --muted:#93a3b1; --line:#2c3946;
  --accent:#5aa4d6; --accent-fg:#0b1722; --co:#78a7d6; --me:#5cc495; --inv:#e0a54a; --out:#ef7a7a; --in:#5cc495; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
.sample{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sample button{color:var(--accent);font-size:12px;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:20px;margin:0;font-weight:700}
.bk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bk i{width:8px;height:8px;border-radius:50%;background:var(--in);display:inline-block}
.bk.late i{background:var(--out)} .bk.late{color:var(--out);font-weight:700}
.wallets{display:grid;grid-template-columns:1fr;gap:8px}
.wcard{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;width:100%}
.wdot{width:10px;height:36px;border-radius:5px}
.wname{font-weight:700;font-size:14px}
.wsub{font-size:12px;color:var(--muted)}
.wbal{font-size:22px;font-weight:500;text-align:right}
.total{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.total b{color:var(--fg);font-weight:500}
section h2{font-size:15px;margin:0;font-weight:700}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:36px;height:36px;border-radius:10px;background:var(--surface);font-size:16px}
.mnav span{min-width:84px;text-align:center;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);font-size:13px;border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 div{background:var(--surface);border-radius:var(--r);padding:10px 12px;min-width:0}
.sum3 small{display:block;font-size:11px;color:var(--muted)}
.sum3 .num{font-size:16px;display:block;overflow-wrap:anywhere}
.panel{background:var(--surface);border-radius:var(--r);padding:6px 14px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .lab{display:flex;align-items:center;gap:8px;min-width:0}
.row .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right}
.row .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:2px}
.row .prev{grid-column:1/-1;font-size:11px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted);margin:4px 0 0}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.empty{padding:16px 0;color:var(--muted);font-size:13px;text-align:center}
.hday{font-size:12px;color:var(--muted);margin:12px 4px 4px;font-weight:700}
.hitem{width:100%;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:6px}
.hitem .m{font-size:12px;color:var(--muted);grid-column:1/-1}
.o{color:var(--out)} .i{color:var(--in)}
/* 下のバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 88px 1fr;align-items:center}
.tab{padding:8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.tab svg{width:22px;height:22px}
.fab{justify-self:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:34px;line-height:1;margin-top:-26px;box-shadow:0 6px 18px rgba(20,50,80,.28)}
/* 入力シート */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:94%;overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead button{color:var(--accent);padding:6px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px}
.seg button{padding:8px 0;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amount{font-size:40px;text-align:right;padding:4px 6px;font-weight:500;min-height:58px}
.amount small{font-size:20px;color:var(--muted);margin-left:4px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.meta input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.meta input[type=text]{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:16px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cat{background:var(--surface);border-radius:12px;padding:10px 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500;border:2px solid transparent}
.cat small{font-size:10px;color:var(--muted);font-weight:400}
.cat[aria-pressed="true"]{border-color:var(--accent)}
.cat:disabled{opacity:.4}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{background:var(--surface);border-radius:12px;height:50px;font-size:22px;font-family:var(--f-num)}
.key:active{background:var(--sunk)}
.pick{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:13px}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.btn:disabled{opacity:.4}
.confirm{background:var(--surface);border:1px solid var(--out);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.confirm div{display:flex;gap:8px}
/* 設定 */
.set{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.set h3{margin:0;font-size:14px}
.set p{margin:0;font-size:12px;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 96px 74px 32px;gap:6px;align-items:center}
.frow.w{grid-template-columns:auto 1fr 120px}
.frow.f{grid-template-columns:1fr 84px 56px 70px 32px}
.frow input,.frow select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px}
.frow .x{color:var(--out);font-size:18px}
.add{color:var(--accent);font-size:14px;text-align:left;padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.4)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const yen = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = new Date();
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 見本のデータ ---------- */
function sample() {
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const d = (mo, day) => ymd(new Date(y, m + mo, Math.min(day, 28)));
  const cats = [
    {id:'fix',  name:'固定費',   kind:'out', wallet:'me'},
    {id:'food', name:'食費',     kind:'out', wallet:'me'},
    {id:'life', name:'日用品',   kind:'out', wallet:'me'},
    {id:'fun',  name:'遊び',     kind:'out', wallet:'me'},
    {id:'gas',  name:'ガソリン', kind:'out', wallet:'co'},
    {id:'buy',  name:'仕入れ',   kind:'out', wallet:'co'},
    {id:'cexp', name:'会社経費', kind:'out', wallet:'co'},
    {id:'cfix', name:'会社の固定費', kind:'out', wallet:'co'},
    {id:'sale', name:'売上',     kind:'in',  wallet:'co'},
    {id:'pay',  name:'給料',     kind:'in',  wallet:'me'},
    {id:'oin',  name:'その他の収入', kind:'in', wallet:'me'},
  ];
  const fixed = [
    {id:'f1', name:'家賃',     amount:85000, day:27, wallet:'me', cat:'fix'},
    {id:'f2', name:'スマホ',   amount:8800,  day:10, wallet:'me', cat:'fix'},
    {id:'f3', name:'保険',     amount:12400, day:5,  wallet:'me', cat:'fix'},
    {id:'f4', name:'事務所',   amount:55000, day:25, wallet:'co', cat:'cfix'},
    {id:'f5', name:'つみたて', amount:30000, day:1,  wallet:'me', to:'inv'},
  ];
  const r = (date, kind, amount, wallet, cat, memo, extra) => ({id:uid(), date, kind, amount, wallet, cat, memo:memo||'', ...extra});
  const recs = [];
  for (const mo of [-1, 0]) {
    const last = mo < 0;
    recs.push(
      r(d(mo,2),'in', 1180000,'co','sale','アルファード'),
      r(d(mo,3),'out',920000,'co','buy','オークション'),
      r(d(mo,4),'out',6400,'co','gas',''),
      r(d(mo,6),'out',2380,'me','food','スーパー'),
      r(d(mo,8),'out',1500,'me','food','昼'),
      r(d(mo,9),'out',3980,'me','life','ドラッグストア'),
      r(d(mo,11),'out',last?12000:6800,'me','fun','飲み'),
      r(d(mo,12),'out',5200,'co','gas',''),
      r(d(mo,14),'out',14300,'co','cexp','工具'),
      {id:uid(), date:d(mo,15), kind:'move', amount:300000, wallet:'co', to:'me', memo:'役員報酬'},
      r(d(mo,16),'out',last?4100:3300,'me','food',''),
      r(d(mo,18),'in',last?640000:0,'co','sale','プリウス'),
    );
  }
  return {
    wallets:[{id:'co',name:'会社',init:2400000},{id:'me',name:'自分',init:420000},{id:'inv',name:'投資',init:1150000}],
    cats, fixed, recs: recs.filter(x => x.amount > 0 && x.date <= ymd(TODAY)),
    lastBackup: Date.now() - 1000*60*47,
  };
}

let S;
try { S = JSON.parse(localStorage.getItem('wallet-proto')) } catch (e) {}
if (!S || !S.wallets) S = sample();
const save = () => { try { localStorage.setItem('wallet-proto', JSON.stringify(S)) } catch (e) {} S.lastBackup = Date.now(); };

/* 固定費：その月のその日を過ぎていて、まだ記録が無ければ自動で入れる */
function applyFixed() {
  const months = [-1, 0].map(o => new Date(TODAY.getFullYear(), TODAY.getMonth() + o, 1));
  for (const f of S.fixed) for (const mStart of months) {
    const key = ymd(mStart).slice(0, 7);
    const date = key + '-' + pad(Math.min(f.day, 28));
    if (date > ymd(TODAY)) continue;
    if (S.recs.some(x => x.fixedId === f.id && x.date.slice(0, 7) === key)) continue;
    S.recs.push(f.to
      ? {id:uid(), date, kind:'move', amount:f.amount, wallet:f.wallet, to:f.to, memo:f.name, fixedId:f.id}
      : {id:uid(), date, kind:'out', amount:f.amount, wallet:f.wallet, cat:f.cat, memo:f.name, fixedId:f.id});
  }
}
applyFixed();

/* ---------- 計算（保存せず、毎回すべての記録から出す） ---------- */
const W = id => S.wallets.find(w => w.id === id) || {name:'?'};
const C = id => S.cats.find(c => c.id === id) || {name:'（消した分類）', kind:'out'};
const wColor = id => `var(--${id})`;
function balance(wid) {
  let b = W(wid).init || 0;
  for (const x of S.recs) {
    if (x.kind === 'in' && x.wallet === wid) b += x.amount;
    if (x.kind === 'out' && x.wallet === wid) b -= x.amount;
    if (x.kind === 'adj' && x.wallet === wid) b += x.amount;
    if (x.kind === 'move') { if (x.wallet === wid) b -= x.amount; if (x.to === wid) b += x.amount; }
  }
  return b;
}
function monthRecs(key, wf) {
  return S.recs.filter(x => x.date.slice(0, 7) === key && (wf === 'all' || x.wallet === wf || x.to === wf));
}
function monthDelta(wid, key) {
  let d = 0;
  for (const x of monthRecs(key, wid)) {
    if (x.kind === 'in') d += x.amount; else if (x.kind === 'out') d -= x.amount;
    else if (x.kind === 'adj') d += x.amount;
    else if (x.kind === 'move') d += (x.to === wid ? x.amount : 0) - (x.wallet === wid ? x.amount : 0);
  }
  return d;
}
function totals(key, wf) {
  const out = {}, inn = {}, mv = {};
  let tin = 0, tout = 0;
  for (const x of monthRecs(key, wf)) {
    if (x.kind === 'out') { out[x.cat] = (out[x.cat] || 0) + x.amount; tout += x.amount; }
    if (x.kind === 'in')  { inn[x.cat] = (inn[x.cat] || 0) + x.amount; tin += x.amount; }
    if (x.kind === 'move') { const k = W(x.wallet).name + ' → ' + W(x.to).name; mv[k] = (mv[k] || 0) + x.amount; }
  }
  return {out, inn, mv, tin, tout};
}

/* ---------- 画面 ---------- */
const V = {tab:'home', month:ymd(TODAY).slice(0, 7), wf:'all'};
const shiftMonth = (key, n) => { const [y, m] = key.split('-').map(Number); return ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); };
const monthLabel = key => { const [y, m] = key.split('-'); return `${y}年${Number(m)}月`; };

function render() {
  const app = $('#app');
  app.innerHTML = `<div class="wrap">
    <div class="sample"><span>試作です。見本のデータで動いています。</span><button data-act="reset">見本に戻す</button></div>
    ${V.tab === 'home' ? home() : V.tab === 'hist' ? hist() : settings()}
  </div>
  <nav class="tabbar" aria-label="画面"><div class="in">
    <button class="tab" data-tab="home" ${V.tab==='home'?'aria-current="page"':''}>${ico('home')}ホーム</button>
    <button class="tab" data-tab="hist" ${V.tab==='hist'?'aria-current="page"':''}>${ico('list')}履歴</button>
    <button class="fab" data-act="new" aria-label="記録する">＋</button>
    <button class="tab" data-tab="set" ${V.tab==='set'?'aria-current="page"':''}>${ico('gear')}設定</button>
  </div></nav>`;
}
function ico(n) {
  const p = {home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', list:'M4 6h16M4 12h16M4 18h10', gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-2-4-2 .5-1.5-1L15 4h-6l-.5 2.5-1.5 1L5 7l-2 4 2 1v0l-2 1 2 4 2-.5 1.5 1L9 20h6l.5-2.5 1.5-1 2 .5 2-4z'}[n];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${p}"/></svg>`;
}
function backupLine() {
  const min = Math.round((Date.now() - S.lastBackup) / 60000);
  const late = min > 60 * 24 * 3;
  const t = new Date(S.lastBackup);
  const when = min < 1 ? 'たった今' : (ymd(t) === ymd(TODAY) ? `今日 ${pad(t.getHours())}:${pad(t.getMinutes())}` : `${t.getMonth()+1}/${t.getDate()}`);
  return `<span class="bk ${late?'late':''}"><i></i>バックアップ ${when}${late?'（送れていません）':''}</span>`;
}

function home() {
  const key = V.month, prevKey = shiftMonth(key, -1);
  const t = totals(key, V.wf), p = totals(prevKey, V.wf);
  const all = S.wallets.reduce((a, w) => a + balance(w.id), 0);
  const maxOut = Math.max(1, ...Object.values(t.out));
  const rows = (obj, prev, kind) => {
    const ks = Object.keys(obj).sort((a, b) => obj[b] - obj[a]);
    if (!ks.length) return `<div class="empty">まだありません</div>`;
    return ks.map(k => { const c = C(k); return `<div class="row">
      <div class="lab"><span class="tag" style="background:${wColor(c.wallet)}">${esc(W(c.wallet).name)}</span><span>${esc(c.name)}</span></div>
      <div class="amt num ${kind}">${yen(obj[k])}</div>
      ${kind==='o'?`<div class="bar"><i style="width:${obj[k]/maxOut*100}%;background:${wColor(c.wallet)}"></i></div>`:''}
      <div class="prev">先月 ${prev[k] ? yen(prev[k]) + '円' : 'なし'}</div></div>`; }).join('');
  };
  return `
  <div class="top"><h1>3つの財布</h1>${backupLine()}</div>
  <div class="wallets">${S.wallets.map(w => { const d = monthDelta(w.id, ymd(TODAY).slice(0,7)); return `
    <button class="wcard" data-act="adjust" data-w="${w.id}" aria-label="${esc(w.name)}の残高を合わせる">
      <span class="wdot" style="background:${wColor(w.id)}"></span>
      <span><span class="wname">${esc(w.name)}の財布</span><br><span class="wsub num">今月 ${d>=0?'+':''}${yen(d)}</span></span>
      <span class="wbal num">${yen(balance(w.id))}<small style="font-size:13px;color:var(--muted)"> 円</small></span>
    </button>`; }).join('')}</div>
  <div class="total"><span>3つの合計</span><b class="num">${yen(all)} 円</b></div>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="mhead"><h2>内訳</h2>
      <div class="mnav"><button data-act="mprev" aria-label="前の月">‹</button><span>${monthLabel(key)}</span><button data-act="mnext" aria-label="次の月">›</button></div></div>
    <div class="chips">${[['all','全部'],...S.wallets.map(w=>[w.id,w.name])].map(([id,n]) => `<button class="chip" data-wf="${id}" aria-pressed="${V.wf===id}">${esc(n)}</button>`).join('')}</div>
    <div class="sum3">
      <div><small>入った</small><span class="num i">${yen(t.tin)}</span></div>
      <div><small>出た</small><span class="num o">${yen(t.tout)}</span></div>
      <div><small>差し引き</small><span class="num">${t.tin-t.tout>=0?'+':''}${yen(t.tin-t.tout)}</span></div>
    </div>
    <div><h2 style="font-size:13px;color:var(--muted);margin:4px 4px 6px">出たお金</h2><div class="panel">${rows(t.out, p.out, 'o')}</div></div>
    <div><h2 style="font-size:13px;color:var(--muted);margin:4px 4px 6px">入ったお金</h2><div class="panel">${rows(t.inn, p.inn, 'i')}</div></div>
    <div><h2 style="font-size:13px;color:var(--muted);margin:4px 4px 6px">財布の間の移動（支出にも収入にも数えない）</h2><div class="panel">${
      Object.keys(t.mv).length ? Object.entries(t.mv).map(([k, v]) => `<div class="row"><div class="lab"><span>${esc(k)}</span></div><div class="amt num">${yen(v)}</div><div class="prev">先月 ${p.mv[k]?yen(p.mv[k])+'円':'なし'}</div></div>`).join('') : '<div class="empty">まだありません</div>'}</div></div>
  </section>`;
}

function recLabel(x) {
  if (x.kind === 'move') return `移動 ${W(x.wallet).name} → ${W(x.to).name}`;
  if (x.kind === 'adj') return `残高合わせ（${W(x.wallet).name}）`;
  return C(x.cat).name;
}
function hist() {
  const list = [...S.recs].sort((a, b) => b.date.localeCompare(a.date) || (b.t||0) - (a.t||0));
  if (!list.length) return `<div class="empty">まだ記録がありません。下の＋から入れます。</div>`;
  let out = '<div class="top"><h1>履歴</h1><span class="bk">押すと直せます</span></div><div>', day = '';
  for (const x of list.slice(0, 80)) {
    if (x.date !== day) { day = x.date; const d = new Date(day); out += `<div class="hday">${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）</div>`; }
    const sign = x.kind === 'in' ? 'i' : x.kind === 'out' ? 'o' : '';
    const amt = x.kind === 'adj' ? (x.amount >= 0 ? '+' : '') + yen(x.amount) : (x.kind === 'out' ? '−' : x.kind === 'in' ? '+' : '') + yen(x.amount);
    out += `<button class="hitem" data-act="edit" data-id="${x.id}">
      <span>${esc(recLabel(x))} ${x.kind!=='move'?`<span class="tag" style="background:${wColor(x.wallet)}">${esc(W(x.wallet).name)}</span>`:''}</span>
      <span class="num ${sign}">${amt}</span>
      ${x.memo||x.fixedId?`<span class="m">${x.fixedId?'固定費（自動）':''}${x.memo&&x.fixedId?'・':''}${esc(x.memo)}</span>`:''}</button>`;
  }
  return out + '</div>';
}

function settings() {
  const wSel = (v, attr) => `<select ${attr}>${S.wallets.map(w => `<option value="${w.id}" ${w.id===v?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`;
  return `<div class="top"><h1>設定</h1></div>
  <div class="set"><h3>財布</h3><p>名前と、使い始めた日の残高。今の残高がずれたら、ホームで財布を押して合わせます。</p>
    ${S.wallets.map((w,i) => `<div class="frow w"><span class="wdot" style="height:24px;background:${wColor(w.id)}"></span>
      <input id="wn${i}" value="${esc(w.name)}" data-set="wname" data-i="${i}" aria-label="財布の名前">
      <input id="wi${i}" class="num" inputmode="numeric" value="${w.init}" data-set="winit" data-i="${i}" aria-label="最初の残高"></div>`).join('')}</div>
  <div class="set"><h3>分類</h3><p>入力のときに大きなボタンで出ます。財布は「この分類を使うことが多い財布」で、押したときに自動で選ばれます。</p>
    ${S.cats.map((c,i) => `<div class="frow"><input id="cn${i}" value="${esc(c.name)}" data-set="cname" data-i="${i}" aria-label="分類の名前">
      ${wSel(c.wallet, `id="cw${i}" data-set="cwallet" data-i="${i}" aria-label="財布"`)}
      <select id="ck${i}" data-set="ckind" data-i="${i}" aria-label="支出か収入か"><option value="out" ${c.kind==='out'?'selected':''}>支出</option><option value="in" ${c.kind==='in'?'selected':''}>収入</option></select>
      <button class="x" data-act="cdel" data-i="${i}" aria-label="${esc(c.name)}を消す">×</button></div>`).join('')}
    <button class="add" data-act="cadd">＋ 分類を足す</button></div>
  <div class="set"><h3>固定費（毎月その日に自動で記録）</h3><p>つみたてのように財布の間で動かすものは「移動」として入ります。</p>
    <div class="frow f" style="font-size:11px;color:var(--muted)"><span>名前</span><span>金額</span><span>毎月</span><span>財布</span><span></span></div>
    ${S.fixed.map((f,i) => `<div class="frow f"><input id="fn${i}" value="${esc(f.name)}" data-set="fname" data-i="${i}" aria-label="名前">
      <input id="fa${i}" class="num" inputmode="numeric" value="${f.amount}" data-set="famt" data-i="${i}" aria-label="金額">
      <input id="fd${i}" class="num" inputmode="numeric" value="${f.day}" data-set="fday" data-i="${i}" aria-label="毎月何日">
      ${wSel(f.wallet, `id="fw${i}" data-set="fwallet" data-i="${i}" aria-label="財布"`)}
      <button class="x" data-act="fdel" data-i="${i}" aria-label="${esc(f.name)}を消す">×</button></div>`).join('')}
    <button class="add" data-act="fadd">＋ 固定費を足す</button></div>
  <div class="set"><h3>バックアップ</h3>
    <p>記録するたび・開くたびに、自社サーバーへ自動で送ります。送る前にこのiPhoneの中で合言葉を使って暗号化するので、サーバーには読めない中身だけが置かれます。</p>
    <div>${backupLine()}</div>
    <button class="btn ghost" data-act="bknow">今すぐ送る</button>
    <button class="btn ghost" data-act="restore">サーバーから戻す（新しいiPhoneのとき）</button>
    <p>合言葉を忘れると戻せません。紙などに控えてください。</p></div>`;
}

/* ---------- 入力シート ---------- */
let F = null; // いま開いているシートの中身
const usage = () => { const u = {}; for (const x of S.recs) if (x.cat) u[x.cat] = (u[x.cat] || 0) + 1; return u; };

function openEntry(rec) {
  if (rec && rec.kind === 'adj') { F = {kind:'adj', wallet:rec.wallet, amount:'', editId:rec.id}; drawSheet(); return; }
  F = rec ? {mode: rec.kind === 'adj' ? 'out' : rec.kind, amount: String(rec.amount), wallet: rec.kind==='move'?rec.wallet:rec.wallet, walletManual: true,
             to: rec.to || 'inv', cat: rec.cat, date: rec.date, memo: rec.memo || '', editId: rec.id, kind: rec.kind}
          : {mode:'out', amount:'', wallet:null, walletManual:false, to:'inv', cat:null, date:ymd(TODAY), memo:''};
  if (!rec) F.wallet = 'me';
  if (rec && rec.kind === 'move') F.mode = 'move';
  F.confirmDel = false;
  drawSheet();
}
function drawSheet() {
  if (!F) { $('#layer').innerHTML = ''; return; }
  if (F.kind === 'adj') return drawAdjust();
  const u = usage();
  const cats = S.cats.filter(c => c.kind === F.mode).sort((a, b) => (u[b.id] || 0) - (u[a.id] || 0));
  const amt = Number(F.amount || 0);
  const wChips = (sel, attr) => S.wallets.map(w => `<button class="chip" ${attr}="${w.id}" aria-pressed="${sel===w.id}">${esc(w.name)}</button>`).join('');
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-label="記録"><div class="in">
    <div class="grab"></div>
    <div class="shead"><button data-act="close">閉じる</button><b>${F.editId ? '記録を直す' : '記録する'}</b><span style="width:48px"></span></div>
    <div class="seg">${[['out','支出'],['in','収入'],['move','移動']].map(([m,n]) => `<button data-mode="${m}" aria-pressed="${F.mode===m}">${n}</button>`).join('')}</div>
    <div class="amount num" aria-live="polite">${amt ? yen(amt) : '<span style="color:var(--muted)">0</span>'}<small>円</small></div>
    ${F.mode === 'move' ? `
      <div class="pick"><span>から</span><div class="chips">${wChips(F.wallet, 'data-from')}</div></div>
      <div class="pick"><span>へ</span><div class="chips">${wChips(F.to, 'data-to')}</div></div>
      <div class="meta"><input type="date" id="fdate" value="${F.date}" aria-label="日付"><input type="text" id="fmemo" placeholder="メモ（なくてよい）" value="${esc(F.memo)}"></div>
      ${keys()}
      <button class="btn" data-act="savemove" ${!amt || F.wallet===F.to ? 'disabled' : ''}>${F.wallet===F.to?'同じ財布です':'移動を記録'}</button>`
    : `
      <div class="meta"><span>財布</span><div class="chips"><button class="chip" aria-pressed="${!F.walletManual}" data-w="">自動</button>${wChips(F.walletManual ? F.wallet : '', 'data-w')}</div></div>
      <p class="hint">${amt ? '分類を押すと保存します' : '金額を打ってから、分類を押します'}</p>
      <div class="cats">${cats.map(c => `<button class="cat" data-cat="${c.id}" aria-pressed="${F.cat===c.id}" ${amt?'':'disabled'}>${esc(c.name)}<small>${F.walletManual ? esc(W(F.wallet).name) : esc(W(c.wallet).name)}</small></button>`).join('')}</div>
      <div class="meta"><input type="date" id="fdate" value="${F.date}" aria-label="日付"><input type="text" id="fmemo" placeholder="メモ（なくてよい）" value="${esc(F.memo)}"></div>
      ${keys()}`}
    ${F.editId ? (F.confirmDel
      ? `<div class="confirm">この記録を消します。元に戻せません。<div><button class="btn danger" data-act="del">消す</button><button class="btn ghost" data-act="nodel">やめる</button></div></div>`
      : `<button class="btn danger" data-act="askdel">この記録を消す</button>`) : ''}
  </div></div>`;
}
const keys = () => `<div class="keys">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k => `<button class="key" data-key="${k}" aria-label="${k==='⌫'?'1文字消す':k}">${k}</button>`).join('')}</div>`;

function readMeta() { const d = $('#fdate'), m = $('#fmemo'); if (d) F.date = d.value || ymd(TODAY); if (m) F.memo = m.value; }
let lastSaved = null;
function commit(rec) {
  if (F.editId) { const i = S.recs.findIndex(x => x.id === F.editId); S.recs[i] = {...S.recs[i], ...rec}; lastSaved = null; toast('直しました'); }
  else { rec.id = uid(); rec.t = Date.now(); S.recs.push(rec); lastSaved = rec.id; toast(`${recLabel(rec)} ${yen(rec.amount)}円を保存しました`, true); }
  save(); F = null; drawSheet(); render();
}

/* 残高合わせ */
function openAdjust(wid) { F = {kind:'adj', wallet:wid, amount:''}; drawSheet(); }
function drawAdjust() {
  const now = balance(F.wallet) - (F.editId ? (S.recs.find(x => x.id === F.editId) || {amount:0}).amount : 0), amt = F.amount === '' ? null : Number(F.amount), diff = amt === null ? 0 : amt - now;
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-label="残高を合わせる"><div class="in">
    <div class="grab"></div>
    <div class="shead"><button data-act="close">閉じる</button><b>${esc(W(F.wallet).name)}の残高を合わせる</b><span style="width:48px"></span></div>
    <p class="hint">通帳やアプリで見た、今の本当の残高を打ちます。差の分を「残高合わせ」として1件だけ記録します。</p>
    <div class="total"><span>アプリの残高</span><b class="num">${yen(now)} 円</b></div>
    <div class="amount num">${amt === null ? '<span style="color:var(--muted)">本当の残高</span>' : yen(amt)}<small>円</small></div>
    <div class="total"><span>差</span><b class="num ${diff<0?'o':'i'}">${diff>=0?'+':''}${yen(diff)} 円</b></div>
    ${keys()}
    <button class="btn" data-act="saveadj" ${amt === null || diff === 0 ? 'disabled' : ''}>この残高に合わせる</button>
    ${F.editId ? (F.confirmDel
      ? `<div class="confirm">この残高合わせを消します。元に戻せません。<div><button class="btn danger" data-act="del">消す</button><button class="btn ghost" data-act="nodel">やめる</button></div></div>`
      : `<button class="btn danger" data-act="askdel">この残高合わせを消す</button>`) : ''}
  </div></div>`;
}

/* 戻す（試作：合言葉を入れる画面だけ） */
function openRestore(step) {
  F = {kind:'restore'};
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-label="サーバーから戻す"><div class="in">
    <div class="grab"></div>
    <div class="shead"><button data-act="close">閉じる</button><b>サーバーから戻す</b><span style="width:48px"></span></div>
    ${step === 2 ? `<div class="confirm" style="border-color:var(--line)">10月21日 14:02 のバックアップが見つかりました（記録 ${S.recs.length} 件）。<br>このiPhoneの今のデータは置き換わります。
      <div><button class="btn" data-act="close">戻す</button><button class="btn ghost" data-act="close">やめる</button></div></div>
      <p class="hint">試作なので、ここでは何も変わりません。</p>`
    : `<p class="hint">最初の設定で決めた合言葉を入れてください。</p>
      <input type="password" id="pw" autocomplete="off" style="font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)" aria-label="合言葉">
      <button class="btn" data-act="restore2">探す</button>`}
  </div></div>`;
}

/* ---------- 操作 ---------- */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">取り消す</button>' : ''}`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-act]'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { V.tab = d.tab; render(); scrollTo(0, 0); return; }
  if (d.wf) { V.wf = d.wf; render(); return; }
  if (d.key && F) {
    if (d.key === '⌫') F.amount = F.amount.slice(0, -1);
    else if ((F.amount + d.key).length <= 10) F.amount = (F.amount + d.key).replace(/^0+/, '');
    if (F.kind !== 'adj') readMeta(); drawSheet(); return;
  }
  if (d.mode) { readMeta(); F.mode = d.mode; F.cat = null; if (d.mode === 'move' && F.wallet === F.to) F.to = F.wallet === 'inv' ? 'me' : 'inv'; drawSheet(); return; }
  if ('w' in d && F && !d.act) { readMeta(); if (d.w) { F.wallet = d.w; F.walletManual = true; } else F.walletManual = false; drawSheet(); return; }
  if (d.from) { readMeta(); F.wallet = d.from; drawSheet(); return; }
  if (d.to) { readMeta(); F.to = d.to; drawSheet(); return; }
  if (d.cat) {
    readMeta(); const c = C(d.cat);
    commit({kind:F.mode, amount:Number(F.amount), wallet:F.walletManual ? F.wallet : c.wallet, cat:c.id, date:F.date, memo:F.memo});
    return;
  }
  switch (d.act) {
    case 'new': openEntry(); break;
    case 'close': F = null; drawSheet(); break;
    case 'edit': openEntry(S.recs.find(x => x.id === d.id)); break;
    case 'adjust': openAdjust(d.w); break;
    case 'savemove': readMeta(); commit({kind:'move', amount:Number(F.amount), wallet:F.wallet, to:F.to, date:F.date, memo:F.memo}); break;
    case 'saveadj': { if (F.editId) S.recs = S.recs.filter(x => x.id !== F.editId); const diff = Number(F.amount) - balance(F.wallet); S.recs.push({id:uid(), t:Date.now(), kind:'adj', amount:diff, wallet:F.wallet, date:ymd(TODAY), memo:''}); save(); F = null; drawSheet(); render(); toast('残高を合わせました'); break; }
    case 'askdel': readMeta(); F.confirmDel = true; drawSheet(); break;
    case 'nodel': F.confirmDel = false; drawSheet(); break;
    case 'del': S.recs = S.recs.filter(x => x.id !== F.editId); save(); F = null; drawSheet(); render(); toast('消しました'); break;
    case 'undo': S.recs = S.recs.filter(x => x.id !== lastSaved); save(); render(); $('#toast').hidden = true; break;
    case 'mprev': V.month = shiftMonth(V.month, -1); render(); break;
    case 'mnext': V.month = shiftMonth(V.month, 1); render(); break;
    case 'reset': S = sample(); applyFixed(); save(); render(); toast('見本に戻しました'); break;
    case 'cadd': S.cats.push({id:uid(), name:'新しい分類', kind:'out', wallet:'me'}); save(); render(); break;
    case 'cdel': S.cats.splice(Number(d.i), 1); save(); render(); break;
    case 'fadd': S.fixed.push({id:uid(), name:'新しい固定費', amount:0, day:1, wallet:'me', cat:'fix'}); save(); render(); break;
    case 'fdel': S.fixed.splice(Number(d.i), 1); save(); render(); break;
    case 'bknow': S.lastBackup = Date.now(); render(); toast('送りました（試作なので、実際には送っていません）'); break;
    case 'restore': openRestore(1); break;
    case 'restore2': openRestore(2); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset; if (!d.set) return;
  const i = Number(d.i), v = el.value, n = Number(String(v).replace(/[^\d]/g, '')) || 0;
  ({wname:() => S.wallets[i].name = v, winit:() => S.wallets[i].init = n,
    cname:() => S.cats[i].name = v, cwallet:() => S.cats[i].wallet = v, ckind:() => S.cats[i].kind = v,
    fname:() => S.fixed[i].name = v, famt:() => S.fixed[i].amount = n, fday:() => S.fixed[i].day = Math.min(28, Math.max(1, n)), fwallet:() => S.fixed[i].wallet = v}[d.set] || (() => {}))();
  save(); render();
});
render();
</script>
